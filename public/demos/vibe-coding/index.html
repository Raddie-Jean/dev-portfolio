// ============ LOCAL STORAGE ============
const STORAGE_KEY = 'wb_nav_data';
function loadState(){ try{ const r=localStorage.getItem(STORAGE_KEY); if(!r)return {tags:{},deleted:[]}; const p=JSON.parse(r); return {tags:p.tags||{},deleted:p.deleted||[]}; }catch{return {tags:{},deleted:[]};} }
function saveState(s){ try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}catch{} }
function getSiteTags(url){ return state.tags[url]||[]; }
function setSiteTags(url,tags){ if(tags.length===0)delete state.tags[url]; else state.tags[url]=tags; saveState(state); }
function isDeleted(url){ return state.deleted.includes(url); }
function markDeleted(url){ if(!state.deleted.includes(url))state.deleted.push(url); saveState(state); }
function undoDelete(url){ state.deleted=state.deleted.filter(u=>u!==url); saveState(state); }

let state=loadState();
const ORIGINAL_SITES={};
Object.keys(data).forEach(k=>{ORIGINAL_SITES[k]=[...data[k].sites];});
Object.keys(data).forEach(k=>{data[k].sites=data[k].sites.filter(s=>!isDeleted(s.url));});

// ============ HELPERS ============
function getFavicon(url){ try{ return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=64`; }catch{return'';} }
function getDisplayUrl(url){ try{ return new URL(url).hostname.replace('www.',''); }catch{return url;} }

// ============ CHART ============
const maxCount=Math.max(...Object.values(data).map(c=>c.sites.length||1));
const chartBars=document.getElementById('chartBars');
let total=0;
Object.values(data).forEach(cat=>{
  total+=cat.sites.length;
  const pct=(cat.sites.length/maxCount*100).toFixed(0);
  const row=document.createElement('div');
  row.className='chart-row';
  row.innerHTML=`<div class="chart-label">${cat.name}</div><div class="chart-bar-bg"><div class="chart-bar" style="width:0%" data-width="${pct}%"><span class="chart-val">${cat.sites.length}</span></div></div>`;
  chartBars.appendChild(row);
});
document.getElementById('chartTotal').textContent=total;
document.getElementById('chartCats').textContent=Object.keys(data).length;
setTimeout(()=>document.querySelectorAll('.chart-bar').forEach(b=>b.style.width=b.dataset.width),100);

// ============ TABS ============
const tabsEl=document.getElementById('tabs');
const allCats=Object.keys(data);
tabsEl.innerHTML=`<div class="tab active" data-cat="all">全部</div>`+allCats.map(k=>`<div class="tab" data-cat="${k}">${data[k].icon} ${data[k].name}</div>`).join('');

// ============ RENDER ============
const catContainer=document.getElementById('categories');
allCats.forEach(k=>{
  const cat=data[k];
  const section=document.createElement('div');
  section.className='category'; section.dataset.cat=k;
  section.innerHTML=`<div class="category-header"><div class="category-icon" style="background:${cat.color}">${cat.icon}</div><div><div class="category-title">${cat.name}</div></div><div class="category-count">${cat.sites.length} 个网站</div></div><div class="grid" id="grid-${k}"></div>`;
  catContainer.appendChild(section);
  renderGrid(section.querySelector('.grid'),cat.sites,k,cat.color);
});

function renderGrid(grid,sites,catKey,bgColor){
  grid.innerHTML=sites.map((site,idx)=>{
    const favicon=getFavicon(site.url),displayUrl=getDisplayUrl(site.url),initial=site.name.charAt(0).toUpperCase();
    const tagKeys=getSiteTags(site.url);
    const tagsHtml=tagKeys.length?tagKeys.map(tk=>{const cfg=TAG_CONFIG.find(t=>t.key===tk);return cfg?`<span class="tag-pill" style="background:${cfg.bg};color:${cfg.color};border-color:${cfg.border}">${cfg.label}</span>`:'';}).join(''):'';
    const safeName=site.name.replace(/'/g,"\\'");
    return `<div class="card" data-url="${site.url}" data-cat="${catKey}" data-idx="${idx}">
      <div class="card-actions">
        <button class="card-action-btn tag-btn" title="打标签" onclick="event.preventDefault();event.stopPropagation();openTagEditor('${site.url}','${safeName}','${catKey}',${idx})">🏷️</button>
        <button class="card-action-btn del" title="删除" onclick="event.preventDefault();event.stopPropagation();removeSite('${site.url}','${catKey}',${idx},'${safeName}')">✕</button>
      </div>
      <a href="${site.url}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:var(--ant-padding-sm)">
        <div class="card-top">
          <div class="card-logo" style="background:${bgColor}">
            <img src="${favicon}" alt="${site.name}" onerror="this.style.display='none';this.parentNode.querySelector('.initial').style.display='flex'"/>
            <span class="initial" style="display:none">${initial}</span>
          </div>
          <div class="card-info"><div class="card-name">${site.name}</div><div class="card-desc">${site.desc}</div></div>
        </div>
        <div class="card-tags">${tagsHtml}</div>
        <div class="card-bottom"><span class="card-url">${displayUrl}</span><span class="card-arrow">↗</span></div>
      </a>
    </div>`;
  }).join('');
}

// ============ TAG EDITOR ============
function openTagEditor(url,name,catKey,idx){
  const existingTags=getSiteTags(url);
  const tagOptionsHtml=TAG_CONFIG.map(t=>{const sel=existingTags.includes(t.key)?' selected':'';return `<div class="tag-option${sel}" data-tag="${t.key}">${t.label}</div>`;}).join('');
  const overlay=document.createElement('div');
  overlay.className='tag-editor-overlay';
  overlay.innerHTML=`<div class="tag-editor"><h3>为网站打标签</h3><p class="te-sub"><span class="te-site-name">${name}</span> · 多选标签分类</p><div class="tag-options">${tagOptionsHtml}</div><div class="te-actions"><button class="te-btn cancel">取消</button><button class="te-btn save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  let selected=[...existingTags];
  overlay.querySelector('.tag-options').addEventListener('click',e=>{const opt=e.target.closest('.tag-option');if(!opt)return;const tk=opt.dataset.tag;if(selected.includes(tk)){selected=selected.filter(t=>t!==tk);opt.classList.remove('selected');}else{selected.push(tk);opt.classList.add('selected');}});
  const close=()=>{if(overlay.parentNode)document.body.removeChild(overlay);};
  overlay.querySelector('.cancel').onclick=close;
  overlay.querySelector('.save').onclick=()=>{setSiteTags(url,selected);refreshCardTags(url);close();};
  overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
}
function refreshCardTags(url){
  const card=document.querySelector(`.card[data-url="${url}"]`);
  if(!card)return; const tagKeys=getSiteTags(url); const tagsEl=card.querySelector('.card-tags'); if(!tagsEl)return;
  tagsEl.innerHTML=tagKeys.length?tagKeys.map(tk=>{const cfg=TAG_CONFIG.find(t=>t.key===tk);return cfg?`<span class="tag-pill" style="background:${cfg.bg};color:${cfg.color};border-color:${cfg.border}">${cfg.label}</span>`:'';}).join(''):'';
}

// ============ DELETE ============
window._undoTimeouts={};
function removeSite(url,catKey,idx,name){
  const card=document.querySelector(`.card[data-url="${url}"]`);
  if(!card)return; card.classList.add('deleting');
  setTimeout(()=>{markDeleted(url);card.remove();updateCounts();showUndoToast(url,catKey,idx,name);},300);
}
function updateCounts(){
  let visibleTotal=0;
  document.querySelectorAll('.category').forEach(c=>{const visible=c.querySelectorAll('.card').length;const countEl=c.querySelector('.category-count');if(countEl)countEl.textContent=`${visible} 个网站`;c.classList.toggle('hidden',visible===0);visibleTotal+=visible;});
  document.getElementById('chartTotal').textContent=visibleTotal;
}
function showUndoToast(url,catKey,idx,name){
  const toastWrap=document.getElementById('toastWrap'),toast=document.createElement('div');
  toast.className='toast';
  toast.innerHTML=`<span class="toast-msg">已移除「<strong>${name}</strong>」</span><span class="toast-undo">撤销</span>`;
  toastWrap.appendChild(toast);
  const tid=setTimeout(()=>toast.remove(),5000);
  window._undoTimeouts[url]=tid;
  toast.querySelector('.toast-undo').onclick=()=>{clearTimeout(tid);toast.remove();restoreSite(url,catKey,idx);};
}
function restoreSite(url,catKey,idx){
  undoDelete(url); const origSites=ORIGINAL_SITES[catKey]; if(!origSites)return;
  const siteData=origSites.find(s=>s.url===url); if(!siteData)return;
  if(!data[catKey].sites.some(s=>s.url===url))data[catKey].sites.push(siteData);
  const grid=document.getElementById(`grid-${catKey}`); if(!grid)return;
  const bgColor=data[catKey].color,favicon=getFavicon(siteData.url),displayUrl=getDisplayUrl(siteData.url),initial=siteData.name.charAt(0).toUpperCase();
  const tagKeys=getSiteTags(siteData.url);
  const tagsHtml=tagKeys.length?tagKeys.map(tk=>{const cfg=TAG_CONFIG.find(t=>t.key===tk);return cfg?`<span class="tag-pill" style="background:${cfg.bg};color:${cfg.color};border-color:${cfg.border}">${cfg.label}</span>`:'';}).join(''):'';
  const safeName=siteData.name.replace(/'/g,"\\'");
  const cardDiv=document.createElement('div');
  cardDiv.className='card'; cardDiv.dataset.url=siteData.url; cardDiv.dataset.cat=catKey; cardDiv.dataset.idx=idx;
  cardDiv.innerHTML=`<div class="card-actions"><button class="card-action-btn tag-btn" title="打标签" onclick="event.preventDefault();event.stopPropagation();openTagEditor('${siteData.url}','${safeName}','${catKey}',${idx})">🏷️</button><button class="card-action-btn del" title="删除" onclick="event.preventDefault();event.stopPropagation();removeSite('${siteData.url}','${catKey}',${idx},'${safeName}')">✕</button></div><a href="${siteData.url}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:var(--ant-padding-sm)"><div class="card-top"><div class="card-logo" style="background:${bgColor}"><img src="${favicon}" alt="${siteData.name}" onerror="this.style.display='none';this.parentNode.querySelector('.initial').style.display='flex'"/><span class="initial" style="display:none">${initial}</span></div><div class="card-info"><div class="card-name">${siteData.name}</div><div class="card-desc">${siteData.desc}</div></div></div><div class="card-tags">${tagsHtml}</div><div class="card-bottom"><span class="card-url">${displayUrl}</span><span class="card-arrow">↗</span></div></a>`;
  cardDiv.style.animation='fadeUp 0.4s var(--ant-motion-ease-in-out) both';
  grid.appendChild(cardDiv);
  const cat=document.querySelector(`.category[data-cat="${catKey}"]`); if(cat)cat.classList.remove('hidden');
  updateCounts();
}

// ============ TAB FILTERING ============
tabsEl.addEventListener('click',e=>{const tab=e.target.closest('.tab');if(!tab)return;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');const cat=tab.dataset.cat;document.querySelectorAll('.category').forEach(c=>{c.classList.toggle('hidden',cat!=='all'&&c.dataset.cat!==cat);});});
</script>
</body>
</html>
